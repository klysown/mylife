<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyLife</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fa;
      color: #1d1d1f;
      line-height: 1.6;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 80px 24px;
      text-align: center;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 8px;
    }

    .tagline {
      font-size: 20px;
      color: #6e6e73;
      margin-bottom: 50px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 28px;
      margin: 18px 0;
      text-align: left;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }

    .card h2 {
      margin-top: 0;
    }

    a {
      color: #007aff;
      text-decoration: none;
      font-weight: 600;
    }

    a:hover {
      text-decoration: underline;
    }

    footer {
      margin-top: 50px;
      color: #86868b;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>MyLife</h1>

    <p class="tagline">
      Your important life information, organized in one place.
    </p>

    <div class="card">
      <h2>Privacy</h2>
      <p>
        Learn how MyLife handles your information and protects your privacy.
      </p>
      <a href="privacy.html">Read the Privacy Policy →</a>
    </div>

    <div class="card">
      <h2>Support</h2>
      <p>
        Need help with MyLife or want to provide feedback?
      </p>
      <a href="support.html">Visit MyLife Support →</a>
    </div>

    <footer>
      © 2026 MyLife. All rights reserved.
    </footer>
  </main>
</body>
</html>
